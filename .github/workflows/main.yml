name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # make audit diffs against the pret/pokered merge-base, which needs full history.
          fetch-depth: 0

      - name: Read rgbds version
        id: rgbds
        run: echo "version=v$(cat .rgbds-version)" >> "$GITHUB_OUTPUT"

      - name: Cache rgbds
        id: rgbds-cache
        uses: actions/cache@v4
        with:
          path: ~/rgbds-install
          key: rgbds-${{ steps.rgbds.outputs.version }}-${{ runner.os }}-22.04

      - name: Build rgbds
        if: steps.rgbds-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          git clone --depth 1 --branch ${{ steps.rgbds.outputs.version }} https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -C /tmp/rgbds -j"$(nproc)"
          make -C /tmp/rgbds install PREFIX="$HOME/rgbds-install"

      - name: Put rgbds on PATH
        run: |
          echo "$HOME/rgbds-install/bin" >> "$GITHUB_PATH"
          sudo apt-get install -yq libpng16-16

      - name: Build all three ROMs
        run: |
          make -j"$(nproc)"
          .github/checkdiff.sh

      - name: Static audit
        run: make audit

      - name: Space report
        run: python3 tools/space_report.py pokered.map pokeblue.map pokeblue_debug.map

      - name: Save layout check
        run: python3 tools/save_schema.py check

      - name: Save converter tests
        run: make save_converter

      - name: Release and crash tool tests
        run: python3 -m unittest tools/test_release.py tools/test_crash_lookup.py tools/test_repro_bundle.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Pillow: a failing smoke test saves a screenshot to the failure
      # artifacts, and without it PyBoy raises PyBoyDependencyError there,
      # aborting the whole run and hiding the real failure.
      - name: Install PyBoy
        run: pip install pyboy==2.7.0 pillow

      - name: Smoke tests
        run: make smoke

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            tools/pyboy_smoke/artifacts/
            *.map
            *.sym
          if-no-files-found: ignore
          retention-days: 14
